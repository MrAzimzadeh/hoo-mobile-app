name: hoo
description: "HOO — premium streetwear from Azerbaijan. Mobile twin of the HOO storefront (shop + 3D Studio)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  app_links: ^7.0.0
  auto_route: 11.1.0 # 11.2.0 needs a newer Flutter than 3.38 (Viewport.scrollCacheExtent)
  bloc: ^9.2.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ">=2.30.0 <2.34.0"
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_custom_tabs: ^2.5.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  phosphor_flutter: ^2.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  sign_in_with_apple: ^7.0.1
  sqlite3_flutter_libs: ^0.5.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  auto_route_generator: ^10.5.0
  drift_dev: ^2.34.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/studio/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
