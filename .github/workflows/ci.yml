name: mobile-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          cache: true
      - run: flutter pub get
      - name: Codegen
        run: dart run build_runner build --delete-conflicting-outputs --force-jit
      - name: Localizations
        run: dart run tool/merge_l10n.dart && flutter gen-l10n
      - name: Format
        run: dart format --output=none --set-exit-if-changed --line-length 160 lib test tool
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Tests
        run: flutter test --coverage
      - name: Build Android (dev, debug)
        run: flutter build apk -t lib/main_dev.dart --debug
      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign -t lib/main_prod.dart --release
